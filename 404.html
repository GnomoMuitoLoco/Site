<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Servidor Magnatas</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 2rem;
        }
        .not-found-content {
            max-width: 600px;
        }
        .not-found-code {
            font-size: 8rem;
            font-weight: 700;
            color: #ffd700;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.9;
        }
        .not-found-title {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }
        .not-found-text {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="not-found">
        <div class="not-found-content">
            <div class="not-found-code">404</div>
            <h1 class="not-found-title">Página não encontrada</h1>
            <p class="not-found-text">A página que você procura não existe ou foi removida.<br>Que tal voltar para o início?</p>
            <a href="index.html" class="btn btn-primary btn-large">Voltar ao Início</a>
        </div>
    </div>
</body>
</html>
